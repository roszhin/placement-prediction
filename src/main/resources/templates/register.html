<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Roshin Analytics</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="/css/saas-orange-theme.css" rel="stylesheet">

    <link href="/css/loader.css" rel="stylesheet">
    <script src="/js/loader.js"></script>
</head>
<body data-theme="light" data-page-id="register">
    
    <div id="ui-wrapper">
        <nav class="navbar-premium" style="position: absolute; top: 0; width: 100%; padding: 24px; display: flex; justify-content: space-between;">
            <a th:href="@{/}" class="brand text-decoration-none d-flex align-items-center" style="font-size: 24px; font-weight: 800; color: var(--text-main);">
                <i class="fa-solid fa-layer-group text-primary me-2"></i>Roshin
            </a>
        </nav>

        <div class="container py-5 mt-5">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6">
                    <div class="corporate-card shadow-lg border-0">
                        <a th:href="@{/}" class="text-muted text-decoration-none mb-3 d-inline-block fw-medium"><i class="fa-solid fa-arrow-left me-2"></i>Back to Home</a>
                        <div class="text-center mb-4 border-bottom pb-4">
                            <h2 class="fw-bold mb-2">Create Account</h2>
                            <p class="text-muted mb-0">Join the Roshin Analytics Platform</p>
                        </div>

                        <div th:if="${error}" class="alert alert-danger border-danger text-danger text-center" th:text="${error}"></div>

                        <form th:action="@{/register}" method="POST" th:object="${registrationDto}">
                            
                            <div class="mb-4">
                                <label class="form-label text-muted">I am a...</label>
                                <select class="form-select" id="roleSelect" name="role" required onchange="toggleFields()">
                                    <option value="" disabled selected>Select Role</option>
                                    <option value="STUDENT">Student</option>
                                    <option value="FACULTY">Faculty</option>
                                    <option value="COMPANY">Company</option>
                                </select>
                            </div>

                            <div id="allFields" style="display: none;">
                                <!-- Common Fields -->
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label text-muted" id="nameLabel">Full Name / Company Name</label>
                                        <input type="text" class="form-control" name="name" required>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label text-muted">Email Address</label>
                                        <div class="input-group">
                                            <input type="email" class="form-control" name="email" id="emailInput" style="border-radius: 10px 0 0 10px;" required>
                                            <button class="btn border-0 text-white px-3 shadow-sm" style="background-color: #F59E0B; border-radius: 0 10px 10px 0; transition: all 0.25s ease;" type="button" id="sendOtpBtn">Send OTP</button>
                                        </div>
                                        <div id="otpMessage" class="form-text text-info mt-1 d-none">Sending OTP...</div>
                                    </div>
                                </div>

                                <div class="row" id="otpBox" style="display: none;">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label text-muted"><i class="fa-solid fa-key me-2"></i>Enter OTP</label>
                                        <div class="input-group">
                                            <input type="text" class="form-control" name="otp" id="otpInput" placeholder="6-digit OTP" maxlength="6" style="border-radius: 10px 0 0 10px;">
                                            <button class="btn border-0 text-white px-3 shadow-sm" style="background-color: #10B981; border-radius: 0 10px 10px 0; transition: all 0.25s ease;" type="button" id="verifyOtpBtn">Verify OTP</button>
                                        </div>
                                        <div id="verifyMessage" class="form-text mt-1 d-none"></div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label text-muted">Password</label>
                                        <input type="password" class="form-control" name="password" required>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label text-muted">Confirm Password</label>
                                        <input type="password" class="form-control" name="confirmPassword" required>
                                    </div>
                                </div>

                                <div class="mb-4">
                                    <label class="form-label text-muted">Phone Number</label>
                                    <input type="text" class="form-control" name="phoneNumber" required>
                                </div>

                                <!-- Student Specific Fields -->
                                <div id="studentFields" style="display: none;">
                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label text-muted">Enrollment Number</label>
                                            <input type="text" class="form-control" name="enrollmentNo" id="enrollmentNo">
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label text-muted">Graduation Year</label>
                                            <input type="number" class="form-control" name="graduationYear" id="graduationYear" min="2020" max="2030">
                                        </div>
                                    </div>
                                    <div class="mb-4">
                                        <label class="form-label text-muted">Department</label>
                                        <select class="form-select" name="department" id="department">
                                            <option value="" disabled selected>Select Department</option>
                                            <option value="Computer Science">Computer Science</option>
                                            <option value="Information Technology">Information Technology</option>
                                            <option value="Electronics">Electronics & Communication</option>
                                            <option value="Mechanical">Mechanical Engineering</option>
                                        </select>
                                    </div>
                                </div>

                                <!-- Company Specific Fields -->
                                <div id="companyFields" style="display: none;">
                                    <div class="mb-3">
                                        <label class="form-label text-muted">Website</label>
                                        <input type="url" class="form-control" name="website" id="website" placeholder="https://">
                                    </div>
                                    <div class="mb-4">
                                        <label class="form-label text-muted">Industry</label>
                                        <input type="text" class="form-control" name="industry" id="industry">
                                    </div>
                                </div>

                                <button type="submit" class="btn btn-primary-premium w-100 mt-2" id="registerBtn" disabled>Create Account</button>
                            </div>
                        </form>
                        
                        <div class="mt-4 pt-4 border-top text-center">
                            <p class="text-muted mb-0">Already have an account? <a th:href="@{/login}" class="text-primary fw-bold text-decoration-none">Login Here</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/otp.js"></script>
    <script>
        function toggleFields() {
            const role = document.getElementById('roleSelect').value;
            const allFields = document.getElementById('allFields');
            const studentFields = document.getElementById('studentFields');
            const companyFields = document.getElementById('companyFields');
            const nameLabel = document.getElementById('nameLabel');

            allFields.style.display = 'block';

            // Reset required flags for specific fields
            document.getElementById('enrollmentNo').required = false;
            document.getElementById('graduationYear').required = false;
            document.getElementById('department').required = false;
            document.getElementById('website').required = false;
            document.getElementById('industry').required = false;

            studentFields.style.display = 'none';
            companyFields.style.display = 'none';

            if (role === 'STUDENT') {
                nameLabel.innerText = "Full Name";
                studentFields.style.display = 'block';
                document.getElementById('enrollmentNo').required = true;
                document.getElementById('graduationYear').required = true;
                document.getElementById('department').required = true;
            } else if (role === 'FACULTY') {
                nameLabel.innerText = "Full Name";
            } else if (role === 'COMPANY') {
                nameLabel.innerText = "Company Name";
                companyFields.style.display = 'block';
                document.getElementById('website').required = true;
                document.getElementById('industry').required = true;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const otpManager = new OtpManager({
                emailInputId: 'emailInput',
                sendBtnId: 'sendOtpBtn',
                otpBoxId: 'otpBox',
                otpInputId: 'otpInput',
                verifyBtnId: 'verifyOtpBtn',
                msgId: 'otpMessage',
                verifyMsgId: 'verifyMessage',
                submitBtnId: 'registerBtn'
            });
        });
    </script>
</body>
</html>
