<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Dashboard - Skill</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="/css/saas-orange-theme.css" rel="stylesheet">

    <link href="/css/loader.css" rel="stylesheet">
    <script src="/js/loader.js"></script>
</head>
<body data-theme="light" data-page-id="dashboard">
        <div class="app-layout">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        <div class="main-content">
            <div th:replace="~{fragments/topbar :: topbar}"></div>
            <div class="page-content">
        

        <div class="container-fluid py-4" >
            
            <!-- Statistics Row -->
            <div class="row mb-4" >
                <div class="col-md-2 mb-3">
                    <div class="corporate-card text-center h-100 p-3">
                        <h3 class="text-light fw-bold" th:text="${activeJobs}">0</h3>
                        <p class="text-muted mb-0 small">Active Jobs</p>
                    </div>
                </div>
                <div class="col-md-2 mb-3">
                    <div class="corporate-card text-center h-100 p-3">
                        <h3 class="text-info fw-bold" th:text="${totalApplications}">0</h3>
                        <p class="text-muted mb-0 small">Total Apps</p>
                    </div>
                </div>
                <div class="col-md-3 mb-3">
                    <div class="corporate-card text-center h-100 p-3">
                        <h3 class="text-warning fw-bold" th:text="${newApplications}">0</h3>
                        <p class="text-muted mb-0 small">New Apps (Pending)</p>
                    </div>
                </div>
                <div class="col-md-2 mb-3">
                    <div class="corporate-card text-center h-100 p-3">
                        <h3 class="text-success fw-bold" th:text="${shortlistedCandidates}">0</h3>
                        <p class="text-muted mb-0 small">Shortlisted</p>
                    </div>
                </div>
                <div class="col-md-3 mb-3">
                    <div class="corporate-card text-center h-100 p-3">
                        <h3 class="text-primary fw-bold" th:text="${selectedCandidates}">0</h3>
                        <p class="text-muted mb-0 small">Selected</p>
                    </div>
                </div>
            </div>

            <!-- Charts Row -->
            <div class="row mb-4" >
                <div class="col-md-8 mb-3">
                    <div class="corporate-card h-100">
                        <h6 class="fw-light mb-3">Applications <span class="fw-bold">per Job</span></h6>
                        <div style="position: relative; height: 250px; width: 100%;">
                            <canvas id="appsPerJobChart"></canvas>
                        </div>
                    </div>
                </div>
                <div class="col-md-4 mb-3">
                    <div class="corporate-card h-100">
                        <h6 class="fw-light mb-3">Status <span class="fw-bold">Distribution</span></h6>
                        <div style="position: relative; height: 250px; width: 100%;">
                            <canvas id="statusChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row">
                <!-- Job List -->
                <div class="col-12" >
                    <div class="corporate-card">
                        <h5 class="fw-light mb-4">Your Active <span class="fw-bold">Vacancies</span></h5>
                        <div class="table-responsive" style="border-radius: var(--radius-lg); border: 1px solid var(--border-color); overflow: hidden;">
                            <table class="table table-hover align-middle mb-0">
                                <thead style="background: var(--bg-color);">
                                    <tr>
                                        <th class="text-uppercase text-muted fw-bold" style="font-size: 12px; letter-spacing: 0.5px; border-bottom: 2px solid var(--border-color);">Title</th>
                                        <th class="text-uppercase text-muted fw-bold" style="font-size: 12px; letter-spacing: 0.5px; border-bottom: 2px solid var(--border-color);">Skills</th>
                                        <th class="text-uppercase text-muted fw-bold" style="font-size: 12px; letter-spacing: 0.5px; border-bottom: 2px solid var(--border-color);">Package</th>
                                        <th class="text-uppercase text-muted fw-bold" style="font-size: 12px; letter-spacing: 0.5px; border-bottom: 2px solid var(--border-color);">Posted At</th>
                                        <th class="text-uppercase text-muted fw-bold text-end" style="font-size: 12px; letter-spacing: 0.5px; border-bottom: 2px solid var(--border-color);">Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="job : ${jobs}">
                                        <td class="fw-medium text-dark">
                                            <div class="d-flex align-items-center">
                                                <div class="rounded-circle bg-orange-light text-orange d-flex align-items-center justify-content-center me-3" style="width: 40px; height: 40px; background-color: rgba(245, 158, 11, 0.1); color: #F59E0B;">
                                                    <i class="fa-solid fa-briefcase"></i>
                                                </div>
                                                <span th:text="${job.jobTitle}"></span>
                                            </div>
                                        </td>
                                        <td>
                                            <span class="badge rounded-pill fw-normal" style="background-color: rgba(0,0,0,0.05); color: #4b5563; border: 1px solid var(--border-color);" th:text="${#strings.abbreviate(job.requiredSkills, 40)}"></span>
                                        </td>
                                        <td class="fw-bold" style="color: #F59E0B;" th:text="${job.packageOffered}"></td>
                                        <td class="text-muted small" th:text="${#temporals.format(job.createdAt, 'dd MMM yyyy')}"></td>
                                        <td class="text-end">
                                            <a th:href="@{/company/job/{jobId}/applicants(jobId=${job.id})}" class="btn btn-sm text-white px-3" style="background: linear-gradient(135deg, #f59e0b 0%, #ea580c 100%); border-radius: 8px; box-shadow: 0 4px 10px rgba(245, 158, 11, 0.2); white-space: nowrap;">
                                                Applicants <i class="fa-solid fa-arrow-right ms-1 small"></i>
                                            </a>
                                        </td>
                                    </tr>
                                    <tr th:if="${#lists.isEmpty(jobs)}">
                                        <td colspan="5" class="text-center py-5 text-muted">
                                            <i class="fa-solid fa-box-open fs-1 text-light mb-3"></i>
                                            <p class="mb-0">You have no active vacancies.</p>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:inline="javascript">
        // Chart.js global defaults for dark theme matching
        Chart.defaults.color = '#a0a0a0';
        Chart.defaults.font.family = "'Inter', 'Segoe UI', Roboto, sans-serif";

        // Applications per Job Bar Chart
        const jobTitles = /*[[${jobTitles}]]*/ [];
        const appsPerJob = /*[[${appsPerJob}]]*/ [];
        
        new Chart(document.getElementById('appsPerJobChart'), {
            type: 'bar',
            data: {
                labels: jobTitles,
                datasets: [{
                    label: 'Applications',
                    data: appsPerJob,
                    backgroundColor: 'rgba(245, 158, 11, 0.2)',
                    borderColor: '#F59E0B',
                    borderWidth: 1,
                    borderRadius: 4
                }]
            },
            options: {
                responsive: true,
                plugins: { legend: { display: false } },
                scales: {
                    y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.05)' } },
                    x: { grid: { display: false } }
                }
            }
        });

        // Status Distribution Pie Chart
        const statusDistribution = /*[[${statusDistribution}]]*/ [0, 0, 0, 0];
        
        new Chart(document.getElementById('statusChart'), {
            type: 'doughnut',
            data: {
                labels: ['Applied', 'Shortlisted', 'Selected', 'Rejected'],
                datasets: [{
                    data: statusDistribution,
                    backgroundColor: ['#F59E0B', '#FDBA74', '#FCD34D', '#10B981', '#6366F1', '#3B82F6'],
                    borderWidth: 0
                }]
            },
            options: {
                responsive: true,
                cutout: '70%',
                plugins: {
                    legend: { position: 'bottom', labels: { boxWidth: 12 } }
                }
            }
        });
    </script>
</body>
</html>
