<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Roshin Analytics</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="/css/saas-orange-theme.css" rel="stylesheet">
    <link href="/css/loader.css" rel="stylesheet">
    <script src="/js/loader.js"></script>
</head>
<body data-theme="light" data-page-id="login">

    <div id="ui-wrapper">
        <nav class="navbar-premium" style="position: absolute; top: 0; width: 100%; padding: 24px; display: flex; justify-content: space-between;">
            <a th:href="@{/}" class="brand text-decoration-none d-flex align-items-center" style="font-size: 24px; font-weight: 800; color: var(--text-main);">
                <i class="fa-solid fa-layer-group text-primary me-2"></i>Roshin
            </a>
        </nav>

        <div class="container" style="height: 100vh; display: flex; align-items: center; justify-content: center;">
            <div class="row justify-content-center w-100">
                <div class="col-md-6 col-lg-5">
                    <div class="corporate-card text-center shadow-lg border-0">
                        <h2 class="fw-bold mb-2">Welcome Back</h2>
                        <p class="text-muted mb-4" id="loginSubtitle">Sign in to your Student account</p>

                        <div class="d-flex flex-wrap justify-content-center mb-4 gap-2">
                            <button type="button" class="btn btn-outline-secondary role-btn active" onclick="selectRole('Student', this)" style="flex: 1 1 45%;">Student</button>
                            <button type="button" class="btn btn-outline-secondary role-btn" onclick="selectRole('Faculty', this)" style="flex: 1 1 45%;">Faculty</button>
                            <button type="button" class="btn btn-outline-secondary role-btn" onclick="selectRole('Company', this)" style="flex: 1 1 45%;">Company</button>
                            <button type="button" class="btn btn-outline-secondary role-btn" onclick="selectRole('Admin', this)" style="flex: 1 1 45%;">Admin</button>
                        </div>

                        <div th:if="${param.error}" class="alert alert-danger border-danger text-danger">
                            Invalid Email or Password.
                        </div>
                        <div th:if="${param.logout}" class="alert alert-success border-success text-success">
                            You have been logged out.
                        </div>
                        <div th:if="${param.registered}" class="alert alert-info border-info text-info">
                            Registration successful! Please login.
                        </div>

                        <form th:action="@{/perform_login}" method="POST" class="text-start" autocomplete="off">
                            <input type="hidden" name="role" id="selectedRole" value="Student">
                            <div class="mb-3">
                                <label class="form-label text-muted"><i class="fa-solid fa-envelope me-2"></i>Email Address</label>
                                <input type="email" class="form-control" name="username" required autocomplete="off">
                            </div>
                            <div class="mb-4">
                                <label class="form-label text-muted"><i class="fa-solid fa-lock me-2"></i>Password</label>
                                <input type="password" class="form-control" name="password" required autocomplete="new-password">
                            </div>
                            <button type="submit" class="btn btn-primary-premium w-100 d-block text-center border-0">Login</button>
                        </form>
                        
                        <div class="mt-4 pt-3 border-top">
                            <p class="text-muted mb-2">Don't have an account? <a th:href="@{/register}" class="text-primary fw-bold text-decoration-none">Register Here</a></p>
                            <a th:href="@{/}" class="btn btn-outline-secondary w-100 mt-2"><i class="fa-solid fa-arrow-left me-2"></i>Back to Home</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function selectRole(role, btnElement) {
            document.getElementById('loginSubtitle').innerText = "Sign in to your " + role + " account";
            const buttons = document.querySelectorAll('.role-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            document.getElementById('selectedRole').value = role;
        }
    </script>
</body>
</html>
