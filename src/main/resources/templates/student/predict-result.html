<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction Results - Skill</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="/css/saas-orange-theme.css" rel="stylesheet">

    <link href="/css/loader.css" rel="stylesheet">
    <script src="/js/loader.js"></script>
</head>
<body data-theme="light" data-page-id="predict">
        <div class="app-layout">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        <div class="main-content">
            <div th:replace="~{fragments/topbar :: topbar}"></div>
            <div class="page-content">
        

        <div class="dashboard-container container py-4" >
            <div class="corporate-card mb-4" >
                <h2 class="fw-bold mb-1">Prediction Results: <span th:text="${job.jobTitle}" style="color: var(--text-muted);"></span></h2>
                <p class="text-muted"><i class="fa-solid fa-building me-2"></i><span th:text="${company.companyName}"></span></p>
                <hr class="border-secondary">
                
                <div class="row align-items-center mt-4">
                    <div class="col-md-4 text-center border-end border-secondary">
                        <div class="score-box text-success" style="font-size: 2.5rem; font-weight: bold;" th:text="${(application.atsScore != null ? application.atsScore : 0.0)} + '%'"></div>
                        <p class="text-muted">ATS Resume Score</p>
                    </div>
                    <div class="col-md-4 text-center border-end border-secondary">
                        <div class="score-box text-info" style="font-size: 2.5rem; font-weight: bold;" th:text="${(application.skillMatchScore != null ? application.skillMatchScore : 0.0)} + '%'"></div>
                        <p class="text-muted">Skill Match</p>
                    </div>
                    <div class="col-md-4 text-center">
                        <div class="score-box text-warning" style="font-size: 2.5rem; font-weight: bold;" th:text="${(application.eligibilityScore != null ? application.eligibilityScore : 0.0)} + '%'"></div>
                        <p class="text-muted">Eligibility</p>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-8" >
                    <div class="corporate-card h-100">
                        <h5 style="color: var(--text-color);"><i class="fa-solid fa-robot me-2"></i>AI Feedback & Analysis</h5>
                        <p class="mt-3 text-muted" style="white-space: pre-wrap;" th:text="${application.aiFeedback != null ? application.aiFeedback : 'No feedback available.'}"></p>
                        
                        <h5 class="mt-4" style="color: var(--text-color);"><i class="fa-solid fa-triangle-exclamation me-2"></i>Skills to Improve</h5>
                        <div class="alert alert-warning mt-2  border-warning text-warning" th:if="${application.missingSkills != null && !application.missingSkills.isEmpty()}">
                            <i class="fa-solid fa-screwdriver-wrench me-2"></i> <span th:text="${application.missingSkills}"></span>
                        </div>
                        <p th:if="${application.missingSkills == null || application.missingSkills.isEmpty()}" class="text-success mt-2">
                            <i class="fa-solid fa-check-circle me-2"></i> Your resume matches all required skills perfectly!
                        </p>
                    </div>
                </div>
                <div class="col-md-4" >
                    <div class="corporate-card h-100 text-center d-flex flex-column justify-content-center">
                        <canvas id="scoreChart" width="200" height="200" class="mb-4"></canvas>
                        
                        <form th:action="@{/student/jobs/{jobId}/apply(jobId=${job.id})}" method="post">
                            <button type="submit" class="btn-primary-premium w-100 fw-bold fs-5 shadow-lg"><i class="fa-solid fa-paper-plane me-2"></i> Confirm Application</button>
                        </form>
                        <p class="small text-muted mt-2">After reviewing the prediction, you can officially apply above.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        const ats = /*[[${application.atsScore}]]*/ 0;
        const skill = /*[[${application.skillMatchScore}]]*/ 0;
        const elig = /*[[${application.eligibilityScore}]]*/ 0;
        
        const ctx = document.getElementById('scoreChart').getContext('2d');
        const scoreChart = new Chart(ctx, {
            type: 'radar',
            data: {
                labels: ['ATS Score', 'Skill Match', 'Eligibility'],
                datasets: [{
                    label: 'Profile Strength',
                    data: [ats, skill, elig],
                    backgroundColor: 'rgba(245, 158, 11, 0.2)', // Amber highlight matching predict theme
                    borderColor: '#ffcc88',
                    pointBackgroundColor: '#ffcc88',
                    pointBorderColor: '#fff',
                    pointHoverBackgroundColor: '#fff',
                    pointHoverBorderColor: '#ffcc88'
                }]
            },
            options: {
                responsive: true,
                scales: {
                    r: {
                        angleLines: { color: 'rgba(255, 255, 255, 0.1)' },
                        grid: { color: 'rgba(255, 255, 255, 0.1)' },
                        pointLabels: { color: getComputedStyle(document.body).getPropertyValue('--text-color').trim(), font: { size: 12 } },
                        ticks: { display: false, min: 0, max: 100 }
                    }
                },
                plugins: {
                    legend: { display: false }
                }
            }
        });

        // Dynamic theme updates for chart labels
        const observer = new MutationObserver((mutations) => {
            mutations.forEach((mutation) => {
                if (mutation.attributeName === 'data-theme') {
                    const textColor = getComputedStyle(document.body).getPropertyValue('--text-color').trim();
                    scoreChart.options.scales.r.pointLabels.color = textColor;
                    scoreChart.update();
                }
            });
        });
        observer.observe(document.body, { attributes: true });
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
