<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Skill</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="/css/saas-orange-theme.css" rel="stylesheet">

    <link href="/css/loader.css" rel="stylesheet">
    <script src="/js/loader.js"></script>
</head>
<body data-theme="light" data-page-id="dashboard">
        <div class="app-layout">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        <div class="main-content">
            <div th:replace="~{fragments/topbar :: topbar}"></div>
            <div class="page-content">
        

        <div class="dashboard-container container py-4" >
            <div class="corporate-card" >
                <h3 class="fw-light mb-4 text-center">Platform <span class="fw-bold">Statistics</span></h3>
                <div class="row mt-4 text-center">
                    <div class="col-md-3">
                        <h2 class="fw-bold" style="color: var(--text-color);" th:text="${studentCount}">0</h2>
                        <p class="text-muted">Total Students</p>
                    </div>
                    <div class="col-md-3">
                        <h2 class="fw-bold" style="color: var(--text-color);" th:text="${companyCount}">0</h2>
                        <p class="text-muted">Total Companies</p>
                    </div>
                    <div class="col-md-3">
                        <h2 class="fw-bold" style="color: var(--text-color);" th:text="${facultyCount}">0</h2>
                        <p class="text-muted">Total Faculty</p>
                    </div>
                    <div class="col-md-3">
                        <h2 class="fw-bold" style="color: var(--text-color);" th:text="${jobCount}">0</h2>
                        <p class="text-muted">Active Jobs</p>
                    </div>
                </div>
            </div>

            <!-- Quick Actions -->
            <div class="row mt-4" >
                <div class="col-md-3 mb-3">
                    <a th:href="@{/admin/students}" class="text-decoration-none">
                        <div class="corporate-card text-center py-4" style="cursor:pointer; transition: transform 0.2s;" onmouseover="this.style.transform='scale(1.04)'" onmouseout="this.style.transform='scale(1)'">
                            <i class="fa-solid fa-users fa-2x mb-3" style="color: var(--text-color);"></i>
                            <h5 class="fw-bold">Manage Students</h5>
                            <p class="text-muted small mb-0">Add, Edit, Delete students</p>
                        </div>
                    </a>
                </div>
                <div class="col-md-3 mb-3">
                    <a th:href="@{/admin/faculty}" class="text-decoration-none">
                        <div class="corporate-card text-center py-4" style="cursor:pointer; transition: transform 0.2s;" onmouseover="this.style.transform='scale(1.04)'" onmouseout="this.style.transform='scale(1)'">
                            <i class="fa-solid fa-chalkboard-user fa-2x mb-3" style="color: var(--text-color);"></i>
                            <h5 class="fw-bold">Manage Faculty</h5>
                            <p class="text-muted small mb-0">Add, Edit, Delete faculty</p>
                        </div>
                    </a>
                </div>
                <div class="col-md-3 mb-3">
                    <a th:href="@{/admin/companies}" class="text-decoration-none">
                        <div class="corporate-card text-center py-4" style="cursor:pointer; transition: transform 0.2s;" onmouseover="this.style.transform='scale(1.04)'" onmouseout="this.style.transform='scale(1)'">
                            <i class="fa-solid fa-building fa-2x mb-3" style="color: var(--text-color);"></i>
                            <h5 class="fw-bold">Manage Companies</h5>
                            <p class="text-muted small mb-0">Add, Edit, Delete companies</p>
                        </div>
                    </a>
                </div>
                <div class="col-md-3 mb-3">
                    <a th:href="@{/admin/profile}" class="text-decoration-none">
                        <div class="corporate-card text-center py-4" style="cursor:pointer; transition: transform 0.2s;" onmouseover="this.style.transform='scale(1.04)'" onmouseout="this.style.transform='scale(1)'">
                            <i class="fa-solid fa-user-shield fa-2x mb-3" style="color: var(--text-color);"></i>
                            <h5 class="fw-bold">My Profile</h5>
                            <p class="text-muted small mb-0">Edit admin details</p>
                        </div>
                    </a>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
