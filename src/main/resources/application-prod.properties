server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
email.resend.api-key=${RESEND_API_KEY:}
email.resend.from=${RESEND_FROM:}
spring.jpa.show-sql=false

email.gmail.client-id=${GMAIL_CLIENT_ID:}
email.gmail.client-secret=${GMAIL_CLIENT_SECRET:}
email.gmail.refresh-token=${GMAIL_REFRESH_TOKEN:}
email.gmail.from=${GMAIL_FROM_EMAIL:}

ai.api.key=${AI_API_KEY}
ai.api.url=${AI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent}

spring.servlet.multipart.max-file-size=${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:10MB}
